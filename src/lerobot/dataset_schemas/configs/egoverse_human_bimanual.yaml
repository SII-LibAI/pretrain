# Egoverse source video and synthetic embodiments. Annotation vectors use the
# same right-first joint layout as EgoDex; training reorders them left-first.
- robot_type: egoverse_human_bimanual
  feature_mapping:
    observation.state: [observation.state]
    action: [action]
  image_mapping:
    observation.images.front: observation.images.image0
  description: "Egoverse source video schema"

- robot_type: egoverse_synthetic_human_eef
  state_dim: 16
  action_dim: 16
  action_mode: end_effector
  # EEF state and future targets are both absolute. Negative entries are left
  # unchanged by DeltaActionTransformFn even when the dataset uses delta mode.
  action_mask_spec: [-16]
  action_reorder: &human_eef_reorder
    - [8, 16, 0, 8]
    - [0, 8, 8, 16]
  state_reorder: *human_eef_reorder
  action_layout:
    - {name: left_eef_position_absolute, size: 3}
    - {name: left_eef_quaternion_xyzw_absolute, size: 4}
    - {name: left_grasp_absolute, size: 1}
    - {name: right_eef_position_absolute, size: 3}
    - {name: right_eef_quaternion_xyzw_absolute, size: 4}
    - {name: right_grasp_absolute, size: 1}
  feature_mapping:
    observation.state: [observation.state]
    action: [action]
  image_mapping:
    observation.images.front: observation.images.image0
  description: "Absolute dual-hand human EEF pose and grasp"

- robot_type: egoverse_synthetic_piper_inspire
  unified_action_reorder: &unified_egoverse_synthetic_piper_inspire
    - [20, 26, 58, 64]
    - [0, 6, 65, 71]
    - [36, 40, 18, 22]
    - [28, 29, 22, 23]
    - [29, 30, 24, 25]
    - [30, 31, 26, 27]
    - [31, 32, 28, 29]
    - [34, 35, 30, 31]
    - [35, 36, 32, 33]
    - [32, 33, 34, 35]
    - [33, 34, 36, 37]
    - [16, 20, 38, 42]
    - [8, 9, 42, 43]
    - [9, 10, 44, 45]
    - [10, 11, 46, 47]
    - [11, 12, 48, 49]
    - [14, 15, 50, 51]
    - [15, 16, 52, 53]
    - [12, 13, 54, 55]
    - [13, 14, 56, 57]
  unified_state_reorder: *unified_egoverse_synthetic_piper_inspire
  embodiment_name: piper_inspire
  state_dim: 40
  action_dim: 40
  action_mode: joint
  action_mask_spec: [6, -14, 6, -14]
  action_reorder: &piper_inspire_reorder
    - [20, 26, 0, 6]
    - [26, 40, 6, 20]
    - [0, 6, 20, 26]
    - [6, 20, 26, 40]
  state_reorder: *piper_inspire_reorder
  action_layout:
    - {name: left_arm, size: 6}
    - {name: left_original_gripper, size: 2}
    - {name: left_hand, size: 12}
    - {name: right_arm, size: 6}
    - {name: right_original_gripper, size: 2}
    - {name: right_hand, size: 12}
  feature_mapping:
    observation.state: [observation.state]
    action: [action]
  image_mapping:
    observation.images.front: observation.images.image0
  description: "Dual Piper arm with Inspire hands"

