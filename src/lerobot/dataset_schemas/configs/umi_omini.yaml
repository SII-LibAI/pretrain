# Franka Emika Panda robot (A1 old format)
- robot_type: genrobot_das_bimanual
  unified_action_reorder: &unified_genrobot_das_bimanual
    - [0, 7, 0, 7]
    - [7, 8, 14, 15]
    - [8, 15, 7, 14]
    - [15, 16, 16, 17]
  unified_state_reorder: *unified_genrobot_das_bimanual
  action_mask_spec: [3,-5,3,-5]
  feature_mapping:
    observation.state:
        - observation.state
    action:
        - action
  image_mapping:
    observation.images.left: observation.images.image0
    observation.images.right: observation.images.image1
  action_mode: end_effector
  description: "umi_omini"

# Retarget annotations are dual-arm, right-first, without dexterous-hand variants.
- robot_type: genrobot_das_bimanual_synthetic_human_eef
  state_dim: 16
  action_dim: 16
  action_mode: end_effector
  # EEF state and future targets are both absolute. Negative entries are left
  # unchanged by DeltaActionTransformFn even when the dataset uses delta mode.
  action_mask_spec: [-16]
  # action.parquet stores right first; the model-facing layout is left first.
  action_reorder: &human_eef_reorder
    - [8, 16, 0, 8]
    - [0, 8, 8, 16]
  state_reorder: *human_eef_reorder
  action_layout:
    - {name: left_eef_position_absolute, size: 3}
    - {name: left_eef_quaternion_xyzw_absolute, size: 4}
    - {name: left_grasp_absolute, size: 1}
    - {name: right_eef_position_absolute, size: 3}
    - {name: right_eef_quaternion_xyzw_absolute, size: 4}
    - {name: right_grasp_absolute, size: 1}
  feature_mapping:
    observation.state: [observation.state]
    action: [action]
  image_mapping:
    observation.images.left: observation.images.image0
    observation.images.right: observation.images.image1
  description: "Absolute dual-hand human EEF pose and grasp"

