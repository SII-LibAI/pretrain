# The first schema describes only the source EgoDex media columns. Synthetic
# actions use the embodiment-specific schemas below after an embodiment is
# selected by SyntheticEmbodimentDataset.
# Annotation vectors are right-side first; training vectors are left-side first.
- robot_type: egodex_v
  feature_mapping:
    observation.state: [observation.state]
    action: [action]
  image_mapping:
    observation.image: observation.images.image0
  description: "EgoDex source video schema (not an embodiment action schema)"

- robot_type: egodex_synthetic_piper
  state_dim: 16
  action_dim: 16
  action_mode: joint
  action_mask_spec: [6, -2, 6, -2]
  action_reorder: &piper_reorder
    - [8, 14, 0, 6]
    - [14, 16, 6, 8]
    - [0, 6, 8, 14]
    - [6, 8, 14, 16]
  state_reorder: *piper_reorder
  action_layout:
    - {name: left_arm, size: 6}
    - {name: left_gripper, size: 2}
    - {name: right_arm, size: 6}
    - {name: right_gripper, size: 2}
  feature_mapping:
    observation.state: [observation.state]
    action: [action]
  image_mapping:
    observation.image: observation.images.image0
  description: "Dual Piper arm with grippers"
  
- robot_type: egodex_synthetic_piper_inspire
  state_dim: 40
  action_dim: 40
  action_mode: joint
  action_mask_spec: [6, -14, 6, -14]
  action_reorder: &piper_inspire_reorder
    - [20, 26, 0, 6]
    - [26, 40, 6, 20]
    - [0, 6, 20, 26]
    - [6, 20, 26, 40]
  state_reorder: *piper_inspire_reorder
  action_layout:
    - {name: left_arm, size: 6}
    - {name: left_hand, size: 14}
    - {name: right_arm, size: 6}
    - {name: right_hand, size: 14}
  feature_mapping:
    observation.state: [observation.state]
    action: [action]
  image_mapping:
    observation.image: observation.images.image0
  description: "Dual Piper arm with Inspire hands"

