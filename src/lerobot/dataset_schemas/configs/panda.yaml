# Panda robot (no gripper)
robot_type: panda
unified_action_reorder: &unified_panda
  - [0, 7, 58, 65]
unified_state_reorder: *unified_panda
action_mask_spec: [7]
feature_mapping:
  observation.state:
    - observation.state
  action:
    - action
image_mapping:
  observation.images.image: observation.images.image0
  observation.images.image2: observation.images.image1
description: "Panda robot (no gripper, all delta action)"
